name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Reproducible workbench client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Set up Python for offline snapshot E2E
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workbench runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[workbench]"

      - name: Validate isolated frontend
        working-directory: workbench
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install locked browser engines
        working-directory: workbench
        run: npx playwright install --with-deps chromium firefox

      - name: Run browser, accessibility, security, and offline gates
        working-directory: workbench
        env:
          EWM_TEST_PYTHON: python
        run: npx playwright test

      - name: Verify network boundary
        run: python scripts/check_workbench_network.py

      - name: Verify reproducible packaged assets
        run: python3 scripts/check_frontend_build.py

  quality:
    name: Quality on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workbench]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Verify generated workbench contracts
        run: |
          cd workbench
          npm run generate:contracts
          git diff --exit-code -- src/contracts/generated.ts

      - name: Test with branch coverage
        run: |
          coverage run -m pytest -q
          coverage report

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "cffconvert==2.0.0" "twine>=6.1"
          python -m build --outdir dist
          python -m twine check dist/*
          cffconvert --validate -i CITATION.cff
          python scripts/check_distribution.py dist

      - name: Install wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/ewm-wheel"
          "$RUNNER_TEMP/ewm-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ewm-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ewm-wheel/bin/python" -c \
            "import importlib.metadata as m; import ewm; assert ewm.__version__ == m.version('economic-world-model')"

      - name: Verify reproducible distributions
        run: python scripts/check_reproducible_build.py

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: Artifact, protocol, and conformance checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workbench]"

      - name: Run fail-closed evidence checks
        run: |
          python -m pytest -q \
            tests/conformance \
            tests/integration/experiments/test_artifact_integrity.py \
            tests/integration/experiments/test_locked_protocol_smoke.py \
            tests/integration/papers/test_conformance_source_verification.py
          python scripts/run_conformance.py

      - name: Run exploratory quick stress checks
        run: python scripts/scientific_stress.py --quick

      - name: Run bounded workbench benchmark
        run: python scripts/benchmark_workbench.py --tier small --repeats 1

      - name: Characterize medium workbench fixture
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/benchmark_workbench.py --tier medium --repeats 3
