name: Release dry-run and GitHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Reproducible release dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "cffconvert==2.0.0" "twine>=6.1"

      - name: Validate tag against package version
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c \
            "import os; from pathlib import Path; ns = {}; exec(Path('src/ewm/_version.py').read_text(), ns); expected = 'v' + ns['__version__']; assert os.environ['RELEASE_TAG'] == expected, f'tag must be {expected}'"

      - name: Build and inspect release artifacts
        run: |
          python -m build --outdir dist
          python -m twine check dist/*
          cffconvert --validate -i CITATION.cff
          python scripts/check_distribution.py dist
          python scripts/check_reproducible_build.py

      - name: Install wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/ewm-release-wheel"
          "$RUNNER_TEMP/ewm-release-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ewm-release-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ewm-release-wheel/bin/python" -c \
            "import importlib.metadata as m; import ewm; assert ewm.__version__ == m.version('economic-world-model')"

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub release
    if: ${{ github.ref_type == 'tag' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist

      - name: Create release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
