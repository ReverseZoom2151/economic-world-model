name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Dependency and source scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[security]"
          python -m pip check

      - name: Audit project dependencies
        run: python -m pip_audit . --strict --progress-spinner off

      - name: Scan Python source
        run: bandit -q -r -ll src/ewm

      - name: Audit locked workbench dependencies
        working-directory: workbench
        run: |
          npm ci
          npm audit --audit-level=high
