name: Bounded property tests

on:
  pull_request:
    paths:
      - "src/ewm/experiments/analysis/statistics.py"
      - "src/ewm/scenarios/fx/**"
      - "tests/properties/**"
      - ".github/workflows/property-fuzz.yml"
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  properties:
    name: Deterministic bounded properties
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install property-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bounded property suite
        run: pytest -q tests/properties --hypothesis-seed=20260828
