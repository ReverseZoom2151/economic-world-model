name: Bounded mutation tests

on:
  schedule:
    - cron: "11 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statistics:
    name: Statistics mutation budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mutation-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mutation]"

      - name: Run configured mutation target
        run: mutmut run "ewm.experiments.statistics.x__validate_confidence*"

      - name: Require every bounded mutant to be killed
        run: |
          mutmut export-cicd-stats
          mutmut results
          python scripts/check_mutation_results.py \
            mutants/mutmut-cicd-stats.json \
            --expected-killed 11
