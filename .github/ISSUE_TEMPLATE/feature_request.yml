name: Feature request
description: Propose a bounded, testable improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user or research problem, not only a preferred solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include public API, compatibility, and scope boundaries where relevant.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: State tests, numerical tolerances, evidence boundaries, or release checks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this proposal.
          required: true
        - label: I have not described local simulation as external evidence.
          required: true
