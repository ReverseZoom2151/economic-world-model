evidence = ["tests/unit/core/test_kernels.py", "tests/unit/core/test_world.py"]
limitation = "The explicit kernel records cover validated finite categorical support and caller-defined probability rows; the universal approximation claim in Theorem A.2 remains outside this implementation scope."

