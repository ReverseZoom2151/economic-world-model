schema_version = 1

# Status describes the current repository, not the ambition of the paper.
# Claim labels separate exact replication from protocol conformance and reconstruction.

[conformance_suite]
schema = "ewm.conformance.v1"
command = "python scripts/run_conformance.py"
cong_evidence = "tests/conformance/test_cong_conformance.py"
han_evidence = "tests/conformance/test_han_conformance.py"
claim_boundary_evidence = "tests/conformance/test_claim_boundaries.py"
reporter = "src/ewm/conformance/report.py"

[[item]]
id = "cong-def-2.1"
source = "cong-2026"
section = "Definition 2.1"
pages = "10-11"
summary = "Economic coherence conditions include hard equalities, inequalities, and soft diagnostics."
status = "implemented"
claim = "source-definition"
implementation = ["src/ewm/core/assurance/coherence.py", "src/ewm/core/domain/constraints.py", "src/ewm/core/domain/definition.py"]
evidence = ["tests/unit/core/test_coherence.py", "tests/unit/core/test_constraints.py", "tests/unit/core/test_definition.py"]
limitation = "The core evaluates declared scalar conditions with explicit units, scales, and tolerances; model authors remain responsible for supplying the history-specific measurement functions."

[[item]]
id = "cong-eq-2.1-2.2"
source = "cong-2026"
section = "Equations 2.1 and 2.2"
pages = "15"
summary = "Learned transition and observation kernels generate next states and outcomes."
status = "implemented"
claim = "source-definition"
