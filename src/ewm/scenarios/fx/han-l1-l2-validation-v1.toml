[[requirement.criteria]]
metric = "fixed_arm_adapted_household_observation_count"
operator = "eq"
value = 0

[[requirement.criteria]]
metric = "adaptation_observation_contrast"
operator = "gte"
value = 12

[[requirement.criteria]]
metric = "paired_seed_count"
operator = "eq"
value = 2

[[requirement.criteria]]
metric = "max_belief_observations"
operator = "lte"
