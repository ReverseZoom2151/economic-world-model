schema_version = "ewm.han-l1-l2.protocol.v1"
protocol_version = 1
protocol_filename = "han-l1-l2-validation-v1.toml"
report_schema = "ewm.han-l1-l2.report.v1"
classification = "synthetic_systems_conformance"
excluded_claims = ["empirical_validation", "prospective_behavioral_study"]
scenario = "fx"
seeds = [17, 42]
periods = 6
arms = ["adaptive", "fixed_beliefs"]
source_files = [
  "agents.py",
  "mechanism.py",
  "model.py",
  "runtime.py",
  "simulation.py",
  "validation.py",
]

[[requirement]]
requirement = "agent_world_execution"
level = "L1"
evidence_kind = "synthetic_test"
minimum_observations = 1

[[requirement.criteria]]
metric = "compiled_run_count"
operator = "eq"
value = 4

[[requirement.criteria]]
metric = "completed_step_count"
operator = "eq"
value = 24

[[requirement.criteria]]
metric = "canonical_event_chain_count"
operator = "eq"
value = 4

[[requirement]]
requirement = "endogenous_environment"
level = "L1"
evidence_kind = "synthetic_test"
minimum_observations = 1

[[requirement.criteria]]
metric = "state_transition_count"
operator = "eq"
value = 24

[[requirement.criteria]]
metric = "period_advance_count"
operator = "eq"
value = 24

[[requirement.criteria]]
metric = "distinct_state_digest_count"
operator = "gte"
value = 7

[[requirement]]
requirement = "economic_invariants"
level = "L1"
evidence_kind = "synthetic_test"
minimum_observations = 1

[[requirement.criteria]]
metric = "max_cash_residual"
operator = "lte"
