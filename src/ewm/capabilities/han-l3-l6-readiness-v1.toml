schema_version = "ewm.han-l3-l6-readiness.protocol.v1"
protocol_version = 1
protocol_filename = "han-l3-l6-readiness-v1.toml"
report_schema = "ewm.han-l3-l6-readiness.report.v1"
classification = "evidence_readiness_only"
seed = 73
source_files = [
  "alignment.py",
  "cognition.py",
  "evolution.py",
  "institutions.py",
  "levels.py",
  "readiness.py",
]

[[requirement]]
requirement = "language_model_execution"
level = "L3"
probe = "cognition"
classification = "fixture_only"
blocker = "only an in-process deterministic fixture backend is exercised; controlled language-model execution is absent"

[[requirement.criterion]]
metric = "cognition_fixture_backend_call_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "explicit_cognitive_state"
level = "L3"
probe = "cognition"
classification = "synthetic_substrate"
blocker = "local state plumbing is observed only as readiness evidence and is not a capability validation artifact"

[[requirement.criterion]]
metric = "cognition_belief_state_observation_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "memory_and_tools"
level = "L3"
probe = "cognition"
classification = "synthetic_substrate"
blocker = "local memory and tool plumbing is observed only as readiness evidence and is not a capability validation artifact"

[[requirement.criterion]]
metric = "cognition_memory_and_tool_observation_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "cognitive_behavior_evaluation"
level = "L3"
probe = "cognition"
classification = "fixture_only"
blocker = "the deterministic fixture has no controlled comparison or behavioral outcome evaluation"

[[requirement.criterion]]
metric = "cognition_fixture_behavior_observation_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "capability_proposal"
level = "L4"
probe = "evolution"
classification = "fixture_only"
blocker = "capability proposals are authored fixtures rather than controlled endogenous proposals"

[[requirement.criterion]]
