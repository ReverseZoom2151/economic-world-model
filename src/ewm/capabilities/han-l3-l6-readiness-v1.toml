value = 1

[[requirement]]
requirement = "repeated_out_of_sample_alignment"
level = "L6"
probe = "alignment"
classification = "fixture_only"
blocker = "one offline fixture is not repeated out-of-sample external validation"

[[requirement.criterion]]
metric = "alignment_fixture_observation_count"
operator = "eq"
value = 1

[[requirement]]
requirement = "drift_monitoring"
level = "L6"
probe = "alignment"
classification = "fixture_only"
blocker = "one offline discrepancy is not longitudinal external drift monitoring"

[[requirement.criterion]]
metric = "alignment_fixture_discrepancy_count"
