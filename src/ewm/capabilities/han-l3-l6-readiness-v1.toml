operator = "eq"
value = 2

[[requirement]]
requirement = "constitutional_institution_gate"
level = "L5"
probe = "institution"
classification = "synthetic_substrate"
blocker = "constitutional gate mechanics are observed only as local readiness evidence"

[[requirement.criterion]]
metric = "institution_constitutional_check_count"
operator = "eq"
value = 10

[[requirement]]
requirement = "accepted_institution_change"
level = "L5"
probe = "institution"
classification = "fixture_only"
blocker = "accepted changes originate from authored fixtures and lack a controlled endogenous proposal process"

[[requirement.criterion]]
metric = "institution_accepted_fixture_change_count"
operator = "eq"
value = 2

[[requirement]]
