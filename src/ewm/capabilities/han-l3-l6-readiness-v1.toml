level = "L4"
probe = "evolution"
classification = "synthetic_substrate"
blocker = "promotion gate mechanics are observed only as local readiness evidence"

[[requirement.criterion]]
metric = "evolution_promoted_version_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "persistent_capability_improvement"
level = "L4"
probe = "evolution"
classification = "fixture_only"
blocker = "serialization persistence is observed but no controlled repeated performance improvement is measured"

[[requirement.criterion]]
metric = "evolution_persisted_version_count"
operator = "eq"
value = 2

[[requirement]]
requirement = "capability_rollback"
level = "L4"
probe = "evolution"
classification = "synthetic_substrate"
blocker = "rollback mechanics are observed only as local readiness evidence"

[[requirement.criterion]]
metric = "evolution_rollback_count"
operator = "eq"
value = 1

[[requirement]]
requirement = "endogenous_institution_proposal"
level = "L5"
probe = "institution"
classification = "fixture_only"
blocker = "institution proposals are authored fixtures rather than endogenous agent outputs"

[[requirement.criterion]]
