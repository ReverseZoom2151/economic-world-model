[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "economic-world-model"
version = "0.1.0"
description = "Transparent synthetic laboratories for Economic World Models and Data-Driven Generative Equilibria"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ReverseZoom2151" }]
keywords = ["economics", "world-models", "agent-based-modeling", "equilibrium", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.scripts]
ewm = "ewm.cli:main"
ewm-run-protocol = "ewm.experiments.protocol_cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pypdf>=6,<7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scikit-learn-stubs>=0.0.3",
  "scipy-stubs>=1.17.1.5,<1.18; python_version < '3.12'",
  "scipy-stubs>=1.18.1.0; python_version >= '3.12'",
]

[project.urls]
Repository = "https://github.com/ReverseZoom2151/economic-world-model"
Issues = "https://github.com/ReverseZoom2151/economic-world-model/issues"
"Cong paper" = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6559940"
"Han et al. paper" = "https://arxiv.org/abs/2608.06020v1"

[tool.hatch.build.targets.wheel]
packages = ["src/ewm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "conformance: paper-level end-to-end and claim-boundary checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["ewm"]

[tool.coverage.run]
source = ["ewm"]
branch = true

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
