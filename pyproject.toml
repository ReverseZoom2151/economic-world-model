[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "economic-world-model"
dynamic = ["version"]
description = "Executable economic worlds with agent-economy runtimes and Data-Driven Generative Equilibrium laboratories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ReverseZoom2151" }]
maintainers = [{ name = "ReverseZoom2151" }]
keywords = ["economics", "world-models", "agent-based-modeling", "equilibrium", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.scripts]
ewm = "ewm.cli:main"
ewm-run-protocol = "ewm.experiments.studies.protocol_cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hatchling>=1.26",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pypdf>=6,<7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scikit-learn-stubs>=0.0.3",
  "scipy-stubs>=1.17.1.5,<1.18; python_version < '3.12'",
  "scipy-stubs>=1.18.1.0; python_version >= '3.12'",
  "twine>=6.1",
]
mutation = ["mutmut==3.7.0"]
release = ["cffconvert==2.0.0"]
security = [
  "bandit[toml]>=1.8",
  "pip-audit>=2.9",
]

[project.urls]
Repository = "https://github.com/ReverseZoom2151/economic-world-model"
Issues = "https://github.com/ReverseZoom2151/economic-world-model/issues"
Documentation = "https://github.com/ReverseZoom2151/economic-world-model#readme"
Changelog = "https://github.com/ReverseZoom2151/economic-world-model/blob/main/CHANGELOG.md"
Security = "https://github.com/ReverseZoom2151/economic-world-model/security/policy"
"Cong paper" = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6559940"
"Han et al. paper" = "https://arxiv.org/abs/2608.06020v1"

[tool.hatch.version]
path = "src/ewm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ewm"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/examples",
  "/references",
  "/scripts",
  "/src",
  "/tests",
  "/*.cff",
  "/*.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "conformance: paper-level end-to-end and claim-boundary checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["ewm"]

[tool.coverage.run]
source = ["ewm"]
branch = true

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/ewm"]
only_mutate = ["src/ewm/experiments/analysis/statistics.py"]
pytest_add_cli_args_test_selection = ["tests/unit/experiments/test_statistics.py"]
pytest_add_cli_args = ["-q"]
mutate_only_covered_lines = false
